name: Build Neon Tic Tac Toe APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tic Tac Toe RGB'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Get game source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Download SDL2 and build APK
        run: |
          set -e
          curl -L -o SDL2.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9.tar.gz
          tar -xzf SDL2.tar.gz
          cp "Tic Tac Toe RGB" main.c
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/25.2.9519653"
          cd SDL2-2.30.9/build-scripts
          COPYSOURCE=1 ./androidbuild.sh com.rithu.neontictactoe "$GITHUB_WORKSPACE/main.c"
          cd ../build/com.rithu.neontictactoe
          ./gradlew assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk/Neon-Tic-Tac-Toe.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Tic-Tac-Toe-APK
          path: apk/Neon-Tic-Tac-Toe.apk
